name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Create plugin ZIP
        run: |
          PLUGIN_NAME="deck-controller"
          mkdir -p "${PLUGIN_NAME}"
          cp -r dist/ "${PLUGIN_NAME}/dist/"
          cp -r backend/ "${PLUGIN_NAME}/backend/"
          cp -r assets/ "${PLUGIN_NAME}/assets/"
          cp -r defaults/ "${PLUGIN_NAME}/defaults/"
          cp main.py "${PLUGIN_NAME}/"
          cp plugin.json "${PLUGIN_NAME}/"
          cp package.json "${PLUGIN_NAME}/"
          cp LICENSE "${PLUGIN_NAME}/"
          cp README.md "${PLUGIN_NAME}/"
          zip -r "${PLUGIN_NAME}.zip" "${PLUGIN_NAME}/"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: deck-controller.zip
          generate_release_notes: true
