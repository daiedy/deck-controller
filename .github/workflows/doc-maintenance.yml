name: Documentation Maintenance

on:
  schedule:
    # Run every 3 days at 09:00 UTC
    - cron: '0 9 */3 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — show what would change without modifying files'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  doc-maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git log analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install GitHub Copilot CLI
        run: npm install -g @githubnext/github-copilot-cli || echo "Copilot CLI not available, using fallback"

      - name: Determine last documented commit
        id: last-doc
        run: |
          if [ -f docs/.last-doc-update ]; then
            LAST_COMMIT=$(cat docs/.last-doc-update)
            echo "last_commit=$LAST_COMMIT" >> $GITHUB_OUTPUT
            echo "Found last documented commit: $LAST_COMMIT"
          else
            LAST_COMMIT=$(git rev-list --max-parents=0 HEAD)
            echo "last_commit=$LAST_COMMIT" >> $GITHUB_OUTPUT
            echo "No previous doc update found, using initial commit"
          fi

      - name: Analyze changes since last doc update
        id: changes
        run: |
          LAST="${{ steps.last-doc.outputs.last_commit }}"
          
          # Get changed files in backend/frontend
          CHANGED=$(git diff --name-only "$LAST"..HEAD -- \
            backend/ src/ main.py plugin.json defaults/ assets/ \
            2>/dev/null || echo "")
          
          if [ -z "$CHANGED" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No code changes detected since last doc update"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changed files:"
            echo "$CHANGED"
            echo "changed_files<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGED" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Generate doc update report
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          LAST="${{ steps.last-doc.outputs.last_commit }}"
          
          echo "# Documentation Maintenance Report" > /tmp/doc-report.md
          echo "" >> /tmp/doc-report.md
          echo "**Period**: $LAST..$(git rev-parse HEAD)" >> /tmp/doc-report.md
          echo "**Date**: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> /tmp/doc-report.md
          echo "" >> /tmp/doc-report.md
          echo "## Changed Code Files" >> /tmp/doc-report.md
          echo '```' >> /tmp/doc-report.md
          echo "${{ steps.changes.outputs.changed_files }}" >> /tmp/doc-report.md
          echo '```' >> /tmp/doc-report.md
          echo "" >> /tmp/doc-report.md
          echo "## Commits" >> /tmp/doc-report.md
          echo '```' >> /tmp/doc-report.md
          git log --oneline "$LAST"..HEAD -- backend/ src/ main.py plugin.json defaults/ assets/ >> /tmp/doc-report.md
          echo '```' >> /tmp/doc-report.md
          
          # Check for specific change categories
          echo "" >> /tmp/doc-report.md
          echo "## Change Categories" >> /tmp/doc-report.md
          
          if echo "${{ steps.changes.outputs.changed_files }}" | grep -q "main.py\|backend/"; then
            echo "- [ ] **Backend API changes** — update ARCHITECTURE.md, README.md API section" >> /tmp/doc-report.md
          fi
          if echo "${{ steps.changes.outputs.changed_files }}" | grep -q "bt_hid_service\|hid_descriptor\|gamepad_sdp"; then
            echo "- [ ] **Bluetooth changes** — update BLUETOOTH.md, ARCHITECTURE.md data flow" >> /tmp/doc-report.md
          fi
          if echo "${{ steps.changes.outputs.changed_files }}" | grep -q "defaults/\|config.py"; then
            echo "- [ ] **Config changes** — update README.md config table, defaults documentation" >> /tmp/doc-report.md
          fi
          if echo "${{ steps.changes.outputs.changed_files }}" | grep -q "src/"; then
            echo "- [ ] **Frontend changes** — update ARCHITECTURE.md component diagram" >> /tmp/doc-report.md
          fi
          if echo "${{ steps.changes.outputs.changed_files }}" | grep -q "plugin.json"; then
            echo "- [ ] **Plugin metadata changes** — update README.md, installation section" >> /tmp/doc-report.md
          fi
          
          cat /tmp/doc-report.md

      - name: Update last-doc-update marker
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run != 'true'
        run: |
          git rev-parse HEAD > docs/.last-doc-update

      - name: Create documentation update PR
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'docs: scheduled documentation maintenance update'
          title: '📚 Documentation Maintenance — Sync docs with code changes'
          body-path: /tmp/doc-report.md
          branch: docs/maintenance-update
          labels: documentation, automated
          assignees: daiedy

      - name: Summary
        if: steps.changes.outputs.has_changes == 'false'
        run: echo "✅ Documentation is up to date — no code changes since last doc update."
