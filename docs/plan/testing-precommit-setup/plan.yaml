tasks:
  # ================================================================
  # WAVE 1: Infrastructure — Config Files
  # ================================================================
  - id: T1
    title: "Create pyproject.toml with Python tool configs"
    description: |
      Create pyproject.toml at repo root consolidating all Python tool configuration.
      This replaces the inline flags in Makefile with proper config file settings.

      File: pyproject.toml
      Sections:
        [project] — name, version, requires-python = ">=3.10"
        [tool.pytest.ini_options] — testpaths = ["tests"], asyncio_mode = "auto"
        [tool.black] — line-length = 100, target-version = ["py310"]
        [tool.isort] — profile = "black", line_length = 100
        [tool.mypy] — python_version = "3.10", ignore_missing_imports = true, strict = false
        [tool.flake8] — max-line-length = 100, extend-ignore = ["E203", "W503"]
          (Note: flake8 doesn't read pyproject.toml natively — use flake8-pyproject or .flake8)
        [tool.pytest.ini_options] — markers for slow tests

      Also create a .flake8 file since flake8 doesn't support pyproject.toml natively
      (unless flake8-pyproject is installed — include it in dev deps).

      Dev dependencies to document (installed via pip):
        pytest, pytest-asyncio, pytest-cov, black, isort, flake8, mypy, pre-commit
    wave: 1
    agent: gem-implementer
    prototype: false
    covers: ["pyproject.toml", ".flake8"]
    priority: high
    status: pending
    flags:
      flaky: false
      retries_used: 0
    dependencies: []
    conflicts_with: []
    context_files:
      - path: Makefile
        description: "Current lint target with inline flags to consolidate"
      - path: defaults/defaults.json
        description: "Reference for project metadata"
    estimated_effort: small
    estimated_files: 2
    estimated_lines: 80
    focus_area: "Python tooling configuration"
    verification:
      - "pyproject.toml is valid TOML (python -c 'import tomllib; ...')"
      - "black --check backend/ main.py passes with pyproject.toml config"
      - "isort --check-only backend/ main.py passes"
