  # ================================================================
  # WAVE 5: Pre-commit Hooks + Makefile
  # ================================================================
  - id: T12
    title: "Set up pre-commit hooks and update Makefile"
    description: |
      Wire everything together with pre-commit framework hooks and updated
      Makefile targets.

      File: .pre-commit-config.yaml
        repos:
          - repo: https://github.com/pre-commit/pre-commit-hooks
            hooks: [trailing-whitespace, end-of-file-fixer, check-yaml, check-json]
          - repo: https://github.com/psf/black
            hooks: [black] (args: --check not needed — pre-commit auto-formats)
          - repo: https://github.com/pycqa/isort
            hooks: [isort]
          - repo: https://github.com/pycqa/flake8
            hooks: [flake8]
          - repo: local
            hooks:
              - id: mypy
                name: mypy
                entry: mypy
                language: system
                types: [python]
                args: [--ignore-missing-imports]
              - id: pytest
                name: pytest
                entry: pytest
                language: system
                types: [python]
                pass_filenames: false
                args: [--tb=short, -q]
              - id: eslint
                name: eslint
                entry: pnpm exec eslint
                language: system
                types_or: [ts, tsx]
              - id: prettier
                name: prettier
                entry: pnpm exec prettier --check
                language: system
                types_or: [ts, tsx, json]
              - id: vitest
                name: vitest
                entry: pnpm exec vitest run
                language: system
                pass_filenames: false
                stages: [pre-commit]

      Makefile changes:
        Add targets:
          test-py: pytest --tb=short -q
          test-ts: pnpm exec vitest run
          test: test-py test-ts
          format: black backend/ main.py && isort backend/ main.py && pnpm exec prettier --write src/
          hooks-install: pre-commit install
          hooks-run: pre-commit run --all-files

        Update lint target: remove inline flags (now in pyproject.toml/.flake8)
          lint:
            black --check backend/ main.py
            isort --check-only backend/ main.py
            flake8 backend/ main.py
            mypy backend/ main.py
            pnpm exec eslint src/
            pnpm exec prettier --check src/

        Update verify target: add test dependency
          verify: lint test build (structural checks)
    wave: 5
    agent: gem-implementer
    prototype: false
    covers: [".pre-commit-config.yaml", "Makefile"]
    priority: high
    status: pending
    flags:
      flaky: false
      retries_used: 0
    dependencies: ["T10", "T11", "T9"]
    conflicts_with: []
    context_files:
