        description: "Current Makefile to modify"
      - path: pyproject.toml
        description: "Python tool configs (created by T1)"
      - path: eslint.config.js
        description: "ESLint config (created by T2)"
      - path: .prettierrc
        description: "Prettier config (created by T2)"
    estimated_effort: small
