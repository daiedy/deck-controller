  affected_areas:
    - "package.json (new devDependencies + test/lint scripts)"
    - "Makefile (new test/format targets, updated lint target)"
    - "tsconfig.json (possibly add test include)"

  component_details:
    - component: "Python test infrastructure"
      responsibility: "pyproject.toml config, conftest.py fixtures, pytest-asyncio setup"
      interfaces: ["pytest CLI", "Makefile targets"]
      dependencies:
        - component: "backend/ modules"
          relationship: "test subjects"
      integration_points: ["pre-commit hooks", "Makefile test target"]

    - component: "TypeScript test infrastructure"
      responsibility: "vitest config, @decky mocks, test utilities"
      interfaces: ["vitest CLI", "pnpm test script"]
      dependencies:
        - component: "src/ modules"
          relationship: "test subjects"
      integration_points: ["pre-commit hooks", "package.json test script"]

    - component: "Pre-commit hooks"
      responsibility: "Run lint + tests on staged files before commit"
      interfaces: ["git hooks", ".pre-commit-config.yaml"]
      dependencies:
        - component: "Python test infrastructure"
          relationship: "runs pytest on staged .py files"
        - component: "TypeScript test infrastructure"
          relationship: "runs vitest on staged .ts/.tsx files"
      integration_points: ["git commit workflow"]

