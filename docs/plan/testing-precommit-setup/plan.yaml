plan_id: testing-precommit-setup
objective: >
  Add comprehensive test coverage (Python + TypeScript) and local pre-commit hooks
  to the deck-controller project. Zero tests and zero hooks exist today.
created_at: "2026-05-08"
created_by: gem-planner
status: pending
research_confidence: high

plan_metrics:
  wave_1_task_count: 3
  total_dependencies: 21
  risk_score: low

tldr: |
  13-task plan across 6 waves. Wave 1 creates all config/infrastructure files
  (pyproject.toml, ESLint, Prettier, vitest). Waves 2-4 add tests from simple→complex:
  pure functions first, then evdev-mocked modules, then the complex BT service and
  main.py orchestrator. Wave 5 wires pre-commit hooks. Wave 6 adds docs.
  ~35 new files, ~1800 lines of test + config code.

open_questions: []

gaps: []

pre_mortem:
  overall_risk_level: low
  critical_failure_modes:
    - scenario: "evdev mock complexity causes test flakiness"
      likelihood: medium
      impact: medium
      mitigation: >
        Test only InputState/MotionState dataclasses and _apply_deadzone pure function
        directly; mock evdev.InputDevice at class level with simple event sequences.
    - scenario: "@decky/ui component mocking breaks on version updates"
      likelihood: low
      impact: low
      mitigation: >
        Use shallow rendering with simple mock stubs that pass through children.
        Pin @testing-library versions in devDependencies.
    - scenario: "pre-commit hooks slow down developer workflow"
      likelihood: medium
      impact: low
      mitigation: >
        Run only staged-file checks (not full suite). Use --staged flags.
        Keep pre-commit fast (<15s). Add skip instructions in docs.
  assumptions:
    - "Dev machine has Python 3.10+ with venv support"
    - "pnpm is installed globally"
    - "Tests run on dev machine only — NOT on SteamOS device"
    - "evdev, socket(AF_BLUETOOTH), dbus are NOT available on dev machine — all mocked"
    - "pre-commit framework can be pip-installed in project venv"

