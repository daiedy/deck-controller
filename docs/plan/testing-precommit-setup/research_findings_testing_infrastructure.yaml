# ============================================================
# SECTION 5: PYTHON MODULE ANALYSIS FOR TEST PLANNING
# ============================================================
python_module_analysis:
  - module: backend/hid_descriptor.py
    lines: 287
    complexity: simple
    public_api:
      - name: GAMEPAD_REPORT_DESCRIPTOR
        type: variable
        description: "Xbox-compatible gamepad HID descriptor bytes"
      - name: MOUSE_REPORT_DESCRIPTOR
        type: variable
        description: "Mouse HID descriptor bytes"
      - name: MOTION_REPORT_DESCRIPTOR
        type: variable
        description: "Motion sensor (vendor-specific) HID descriptor bytes"
      - name: COMPOSITE_REPORT_DESCRIPTOR
        type: variable
        description: "Combined gamepad+mouse+motion descriptor"
      - name: pack_report
        type: function
        description: "Pack gamepad state into HID report (15 bytes)"
        signature: "(buttons, left_x, left_y, right_x, right_y, l2, r2, dpad) -> bytes"
      - name: pack_mouse_report
        type: function
        description: "Pack mouse state into HID report"
        signature: "(buttons, dx, dy, wheel) -> bytes"
      - name: pack_motion_report
        type: function
        description: "Pack motion sensor data into HID report"
        signature: "(gyro_x, gyro_y, gyro_z, accel_x, accel_y, accel_z) -> bytes"
      - name: "DPAD_* / BTN_* constants"
        type: variable
        description: "D-pad directions and button bit position constants"
    external_dependencies:
      - struct  # stdlib only
    mocking_requirements: []
    test_notes: |
      HIGHLY TESTABLE — pure functions with no I/O dependencies.
      Test packing at boundary values, clamping behavior, report sizes.
      Verify descriptor bytes haven't been corrupted (snapshot tests).

  - module: backend/trackpad_mouse.py
    lines: 95
    complexity: simple
    public_api:
      - name: TrackpadMouse
        type: class
        description: "Converts absolute trackpad positions to relative mouse deltas"
        methods:
          - "update_right(x, y, touching) -> (dx, dy)"
          - "update_left(y, touching) -> int (wheel)"
          - "reset() -> None"
    external_dependencies: []  # dataclasses only (stdlib)
    mocking_requirements: []
    test_notes: |
      HIGHLY TESTABLE — pure state machine with no I/O.
      Test: first touch (no movement), delta calculation, sensitivity scaling,
      clamping to -127..127, lift-and-replace behavior, reset.

  - module: backend/config.py
    lines: 158
    complexity: simple
    public_api:
      - name: Config
        type: class
        description: "Thread-safe JSON config manager with defaults"
        methods:
          - "__init__(config_path, defaults_path)"
          - "get(key, default) -> Any"
          - "set(key, value) -> None"
          - "save() -> None"
          - "to_dict() -> dict"
        properties:
          - "controller_name, auto_connect, polling_rate_hz, deadzone"
          - "enable_gyro, enable_trackpads, bt_device_class, max_connections"
    external_dependencies:
      - json  # stdlib
      - threading  # stdlib
      - os  # stdlib
    mocking_requirements:
      - filesystem: "mock open() or use tmp_path fixture for config/defaults files"
    test_notes: |
      TESTABLE with tmp_path — create temp config files, verify load/save/merge.
      Test: defaults loading, user config override, missing file handling,
      thread safety (concurrent get/set), property accessors.

  - module: backend/profile_manager.py
    lines: 198
    complexity: simple
    public_api:
      - name: Profile
        type: dataclass
        description: "Controller profile with report types and sensitivity settings"
        methods:
          - "sends_gamepad() -> bool"
          - "sends_mouse() -> bool"
          - "sends_motion() -> bool"
          - "to_dict() -> dict"
          - "from_dict(data) -> Profile (classmethod)"
      - name: DEFAULT_PROFILES
        type: variable
        description: "List of 4 default profiles (Desktop, FPS, Racing, Media)"
      - name: ProfileManager
        type: class
        description: "Profile CRUD + switching with JSON persistence"
        methods:
          - "__init__(settings_dir)"
          - "switch_profile(index) -> Profile"
          - "switch_by_name(name) -> Profile | None"
          - "add_profile(profile) -> int"
          - "remove_profile(index) -> bool"
          - "to_dict() -> dict"
        properties:
          - "active_profile, profiles"
    external_dependencies:
      - json  # stdlib
      - os  # stdlib
    mocking_requirements:
      - filesystem: "mock or use tmp_path for profiles.json"
    test_notes: |
      TESTABLE with tmp_path — Profile dataclass is pure, ProfileManager needs
      temp directory. Test: default profiles, load/save, switch, add/remove,
      edge cases (remove last, invalid index), from_dict validation.

  - module: backend/input_reader.py
    lines: 359
    complexity: complex
    public_api:
      - name: InputState
        type: dataclass
        description: "Normalized gamepad state (buttons, sticks, triggers, dpad, trackpads)"
        methods:
          - "copy() -> InputState"
      - name: InputReader
        type: class
        description: "Evdev input reader for Steam Deck controller"
        methods:
          - "find_devices() -> list[dict] (static)"
          - "start(callback, grab) -> bool"
          - "stop() -> None"
        properties:
          - "is_running, current_state"
      - name: _apply_deadzone
        type: function
        description: "Apply deadzone threshold to axis value"
    external_dependencies:
      - evdev: "InputDevice, categorize, ecodes, list_devices, async_read_loop"
      - asyncio: "Task, create_task, CancelledError"
    mocking_requirements:
      - evdev.InputDevice: "mock device with async_read_loop, grab/ungrab"
      - evdev.list_devices: "mock to return test device paths"
      - evdev.ecodes: "use real ecodes constants"
    test_notes: |
      InputState and _apply_deadzone are testable without mocking.
      InputReader requires evdev mocking — mock InputDevice with fake events.
      Test: device discovery, button/axis/dpad event processing, deadzone,
      trackpad state, grab/ungrab lifecycle.

  - module: backend/imu_reader.py
    lines: 230
    complexity: medium
    public_api:
      - name: MotionState
        type: dataclass
        description: "IMU state — gyro XYZ + accel XYZ"
      - name: CalibrationData
        type: dataclass
        description: "Gyroscope zero-offset calibration"
      - name: IMUReader
        type: class
        description: "Evdev IMU reader with auto-calibration"
        methods:
          - "find_imu_device() -> str | None (static)"
          - "start(callback) -> bool"
          - "stop() -> None"
        properties:
          - "is_running, is_calibrated"
    external_dependencies:
      - evdev: "InputDevice, ecodes, list_devices, async_read_loop"
      - asyncio: "Task, create_task, CancelledError"
    mocking_requirements:
      - evdev.InputDevice: "mock IMU device with fake events"
      - evdev.list_devices: "mock to return test IMU device paths"
    test_notes: |
      MotionState/CalibrationData are pure dataclasses.
      Calibration logic (_finalize_calibration) is testable if _process_event
      can be called directly with mock events. Test: calibration averaging,
      offset application, clamping.

  - module: backend/bt_hid_service.py
    lines: 495
    complexity: complex
    public_api:
      - name: ConnectionInfo
        type: class
        description: "Connected device info (address, name)"
      - name: BTHIDService
        type: class
        description: "Bluetooth HID gamepad service — BlueZ + L2CAP"
        methods:
          - "start(controller_name, device_class) -> bool"
          - "stop() -> None"
          - "send_report(report) -> bool"
          - "get_status() -> dict"
          - "get_paired_devices() -> list[dict]"
        properties:
          - "is_connected, connected_device"
    external_dependencies:
      - socket: "AF_BLUETOOTH, SOCK_SEQPACKET, BDADDR_ANY (L2CAP)"
      - subprocess: "bluetoothctl, hciconfig, sdptool, pkill, systemctl"
      - asyncio: "create_subprocess_exec, wait_for, Task"
      - xml.etree.ElementTree: "SDP record parsing"
      - os: "file path operations"
    mocking_requirements:
      - socket.socket: "mock L2CAP socket creation, bind, listen, accept, send"
      - subprocess.run: "mock all bluetoothctl/hciconfig/sdptool calls"
      - asyncio.create_subprocess_exec: "mock systemctl/bluetoothctl async calls"
      - filesystem: "mock SDP XML file read"
    test_notes: |
      MOST COMPLEX module. Heavy system interaction makes unit testing challenging.
      Strategy: (1) Test ConnectionInfo and get_status() with minimal mocking,
      (2) Mock subprocess for adapter property setting, (3) Mock socket for
      L2CAP lifecycle, (4) Integration tests on real hardware only.

  - module: main.py
    lines: 358
    complexity: medium
    public_api:
      rpc_methods:
        - "start_broadcasting() -> dict"
        - "stop_broadcasting() -> dict"
        - "get_status() -> dict"
        - "get_devices() -> list[dict]"
        - "set_config(key, value) -> dict"
        - "get_config() -> dict"
        - "enable_gyro() -> dict"
        - "disable_gyro() -> dict"
        - "remove_device(address) -> dict"
        - "get_profiles() -> dict"
        - "switch_profile(index) -> dict"
        - "add_profile(profile_data) -> dict"
        - "remove_profile(index) -> dict"
      internal_methods:
        - "_main() -> None (lifecycle)"
        - "_unload() -> None (cleanup)"
        - "_uninstall() -> None"
        - "_on_input_state_change(state) -> None"
        - "_on_motion_state_change(state) -> None"
    backend_imports:
      - "backend.bt_hid_service.BTHIDService"
      - "backend.config.Config"
      - "backend.hid_descriptor.pack_report, pack_mouse_report, pack_motion_report"
      - "backend.input_reader.InputReader, InputState"
      - "backend.imu_reader.IMUReader, MotionState"
      - "backend.profile_manager.ProfileManager, Profile"
      - "backend.trackpad_mouse.TrackpadMouse"
    external_dependencies:
      - decky: "DeckyLoader runtime module (stubbed for dev)"
      - asyncio: "create_subprocess_exec, wait_for, Task, CancelledError"
    mocking_requirements:
      - decky: "already has dev stub in main.py"
      - BTHIDService: "mock start/stop/send_report/get_status"
      - InputReader: "mock start/stop"
      - IMUReader: "mock start/stop"
      - Config: "mock or use tmp_path"
      - ProfileManager: "mock or use tmp_path"
    test_notes: |
      Plugin class methods are thin orchestration layers. Mock all backend modules
      and test RPC method logic: validation in set_config (ALLOWED_KEYS, range checks),
      error handling, lifecycle orchestration.

