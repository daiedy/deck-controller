# 3. ARCHITECTURE COHERENCE
# ═══════════════════════════════════════════════════════════════════

architecture:
  dependency_graph:
    main_py:
      imports: [BTHIDService, Config, InputReader, InputState, IMUReader, MotionState, ProfileManager, Profile, TrackpadMouse, pack_report, pack_mouse_report, pack_motion_report]
      circular_deps: none
    backend_bt_hid_service:
      imports: [asyncio, logging, os, socket, subprocess, xml.etree.ElementTree]
      circular_deps: none
    backend_input_reader:
      imports: [evdev, hid_descriptor.DPAD_NEUTRAL]
      circular_deps: none
    backend_hid_descriptor:
      imports: [struct]
      circular_deps: none
    backend_imu_reader:
      imports: [evdev]
      circular_deps: none
    backend_trackpad_mouse:
      imports: []  # pure dataclass, zero imports
      circular_deps: none
    backend_profile_manager:
      imports: [json, logging, os, dataclasses]
      circular_deps: none
    backend_config:
      imports: [json, os, threading, pathlib]
      circular_deps: none

  clean_separation: true
  notes: |
    All backend modules depend only on stdlib + evdev. No circular imports.
    main.py is the only orchestrator — it wires InputReader callbacks through
    ProfileManager to BTHIDService. Clean layered architecture.
    hid_descriptor.py is a pure data/packing module with no side effects.
    TrackpadMouse is a stateless-ish converter with no external deps.

