# 4. SDP vs HID DESCRIPTOR ALIGNMENT
# ═══════════════════════════════════════════════════════════════════

sdp_descriptor_alignment:
  status: aligned
  details:
    psm_control:
      sdp_value: "0x0011 (17)"
      code_value: "PSM_CONTROL = 17"
      match: true
    psm_interrupt:
      sdp_value: "0x0013 (19)"
      code_value: "PSM_INTERRUPT = 19"
      match: true
    device_class:
      sdp_subclass: "0x08 (Gamepad)"
      code_class: "0x002508"
      match: true  # 0x002508 = Major:Peripheral(0x0500), Minor:Gamepad(0x08)
    hid_version:
      sdp_value: "0x0101 (v1.1)"
      code_assumption: "HID 1.1"
      match: true
    service_uuid:
      sdp_value: "0x1124 (HumanInterfaceDeviceService)"
      code_usage: "HID profile"
      match: true
    descriptor_in_sdp:
      embedded: true
      sdp_attribute: "0x0206"
      sdp_description: "Bluetooth HID Gamepad + Mouse + Motion"
      detail: |
        The SDP hex blob in attribute 0x0206 contains a composite descriptor
        matching the concatenation of GAMEPAD + MOUSE + MOTION descriptors.
        This is ALREADY the composite descriptor despite docs claiming otherwise.
    service_name:
      sdp_value: "Deck Controller"
      code_default: "Deck Controller"
      match: true
    virtual_cable:
      sdp_value: true
      note: "Supports reconnection initiation"
    boot_device:
      sdp_value: false
      note: "Correct — gamepad is not a boot device (keyboard/mouse boot protocol)"

  issues:
    - issue: "SDP has composite descriptor but ARCHITECTURE.md describes gamepad-only"
      severity: documentation
      detail: "SDP attribute 0x0206 hex blob already contains 3 Application Collections"

# ═══════════════════════════════════════════════════════════════════
# 5. COMPOSITE HID PLAN ASSESSMENT
# ═══════════════════════════════════════════════════════════════════

composite_hid_assessment:
  feasibility: high
  implementation_status:
    phase_1_mouse: implemented
    phase_2_back_buttons: implemented
    phase_3_imu: implemented
    phase_4_profiles: partially_implemented  # missing consumer control + quick-switch

  technical_risks:
    - risk_id: R1
      description: "iOS composite gamepad recognition"
      current_status: unmitigated
      detail: |
        No per-OS descriptor selection implemented. SDP always sends composite.
        iOS GCExtendedGamepad MAY reject composite with vendor-specific collections.
        Needs real-device testing.

    - risk_id: R2
      description: "IMU evdev availability across SteamOS versions"
      current_status: mitigated
      detail: |
        IMUReader.find_imu_device() gracefully returns None if no device found.
        main.py logs warning and continues without IMU. Proper degradation.

    - risk_id: R3
      description: "BT bandwidth with multiple report types"
      current_status: partially_mitigated
      detail: |
        ProfileManager controls which reports are sent, reducing load.
        But no explicit rate limiting per report type is implemented.
        All reports fire on every input state change.

    - risk_id: R5
      description: "Steam EVIOCGRAB conflict"
      current_status: unmitigated_critical
      detail: |
        input_reader.py grabs the device (EVIOCGRAB) but if Steam Client has
        already grabbed it, the grab will fail silently (logs warning, continues
        without exclusive grab). This means Steam could receive inputs simultaneously,
        or the grab could fail entirely in Gaming Mode. No coordination with
        Steam Input or lizard mode.

  descriptor_budget:
    gamepad_bytes: 89  # approximate from code
    mouse_bytes: 67    # approximate from code
    motion_bytes: 35   # approximate from code
    total_bytes: 191
    sdp_limit: 400
    status: "well within budget (48% of limit)"

# ═══════════════════════════════════════════════════════════════════
# 6. ADR COMPLETENESS
# ═══════════════════════════════════════════════════════════════════

adr_assessment:
  existing_adrs:
    - id: "ADR-001"
      title: "Bluetooth HID Emulation Strategy"
      status: accepted
      still_valid: true
      notes: "Solid. Decision to use BlueZ CLI + L2CAP sockets is proven in code."

    - id: "ADR-002"
      title: "SteamOS Filesystem Strategy"
      status: accepted
      still_valid: true
      notes: "Solid. Runtime-only modifications strategy is consistently applied."

  missing_adrs:
    - suggested_id: "ADR-003"
      title: "Composite HID Device Strategy"
      rationale: |
        The decision to use multiple Application Collections with separate Report IDs
        (vs. separate BT profiles, vs. UHID, vs. BLE) is a significant architectural
        decision. The composite-hid-smart-mapping plan contains this context but it's
        not formalized as an ADR.
      alternatives_to_document:
        - "Multiple Application Collections (chosen)"
        - "Separate BT HID profiles per device type"
        - "Single gamepad-only descriptor with software remapping on host"

    - suggested_id: "ADR-004"
      title: "Vendor-Specific Motion Report Strategy"
      rationale: |
        Decision to use Usage Page 0xFF00 (Vendor Specific) for gyro/accel instead
        of standard HID sensor page (0x20) is a key compatibility trade-off.
        SDL2 compatibility vs. native OS sensor APIs. iOS exclusion is documented
        in plan but not in ADR.
      alternatives_to_document:
        - "Vendor-Specific 0xFF00 DualSense-style (chosen)"
        - "HID Sensor Usage Page 0x20 (standard but poorly supported)"
        - "No motion data (simplest)"

    - suggested_id: "ADR-005"
      title: "Profile System Design — Send-Side vs Descriptor-Side"
      rationale: |
        Decision that profiles control which Report IDs are sent (not which
        descriptor is advertised) is fundamental. This means the descriptor
        cannot change without re-pairing. Plan documents this but no ADR.

