plan_id: deck-controller-setup
objective: |
  Set up the deck-controller repository — a DeckyLoader plugin that turns Steam Deck
  into a Bluetooth HID gamepad controller for PC, Android, and iOS/macOS. Create all
  project scaffolding, backend (Python BT HID), frontend (React/TSX), documentation,
  CI/CD, and agent/skill infrastructure.
created_at: "2026-05-06"
created_by: gem-planner
status: pending
research_confidence: high

plan_metrics:
  wave_1_task_count: 6
  total_dependencies: 14
  risk_score: medium

tldr: |
  38 files across 6 waves. Wave 1 bootstraps all config/scaffolding (6 parallel tasks).
  Wave 2 builds core backend (BT HID, input reader, HID descriptor) and frontend shell.
  Wave 3 wires frontend components to backend RPC. Wave 4 adds CI/CD and docs.
  Wave 5 creates GitHub agents/skills. Wave 6 adds README with full architecture.
  Critical risk: BlueZ D-Bus and L2CAP require _root flag and SteamOS-specific paths.

open_questions:
  - question: "Which SDP service record UUID to use for HID gamepad?"
    context: "Standard HID UUID is 0x0011, but iOS requires specific SDP attributes"
    type: research
    affects: [backend-bt-hid, assets-sdp]
  - question: "Does SteamOS immutable fs allow installing dbus-python system-wide?"
    context: "SteamOS uses read-only rootfs; may need bundled deps"
    type: decision_blocker
    affects: [backend-bt-hid, docs-steamos]

gaps: []

pre_mortem:
  overall_risk_level: medium
  critical_failure_modes:
    - scenario: "BlueZ D-Bus API unavailable or restricted on SteamOS"
      likelihood: medium
      impact: critical
      mitigation: "Test on actual Steam Deck early; fallback to bluetoothctl subprocess"
    - scenario: "L2CAP sockets require CAP_NET_ADMIN not available to plugin"
      likelihood: medium
      impact: high
      mitigation: "_root flag in plugin.json grants root; verify capability set"
    - scenario: "iOS refuses pairing without specific SDP attributes"
      likelihood: high
      impact: medium
      mitigation: "Use known-good SDP record from open-source BT HID projects (btkb, bluetooth_hid)"
  assumptions:
    - "DeckyLoader v2.5+ with api_version 1 is the target"
    - "SteamOS 3.x with BlueZ 5.x and Linux kernel 6.x"
    - "_root flag provides sufficient permissions for raw BT sockets"
    - "evdev can read Steam Deck built-in gamepad at /dev/input/event*"
    - "pnpm v9 is used for frontend package management"

implementation_specification:
  code_structure: |
    Root: DeckyLoader plugin standard layout (main.py, src/, plugin.json, package.json)
    Backend: main.py orchestrates backend/ modules (bt_hid_service, input_reader, hid_descriptor, config)
    Frontend: src/index.tsx entry → components (MainView, DeviceList, Settings) + hooks (useBackend)
    Assets: SDP XML record + default config JSON
    Docs: Architecture, development, BT protocol, SteamOS constraints, ADRs
    CI: GitHub Actions for build validation and release packaging
  affected_areas:
    - "Repository root (all scaffolding files)"
    - "backend/ (Python BT HID modules)"
    - "src/ (React frontend)"
    - "assets/ + defaults/ (static resources)"
    - "docs/ (documentation)"
    - ".github/ (CI, agents, skills, templates)"
  component_details:
    - component: "Plugin Entry (main.py)"
      responsibility: "DeckyLoader lifecycle; delegates to backend modules"
      interfaces: ["callable RPC methods for frontend", "decky.emit events"]
      dependencies:
        - component: "bt_hid_service"
          relationship: "creates/manages BT HID session"
        - component: "input_reader"
          relationship: "reads gamepad input via evdev"
        - component: "config"
          relationship: "loads/saves settings"
      integration_points: ["DeckyLoader Plugin sandbox", "Frontend via WebSocket RPC"]

    - component: "BT HID Service (backend/bt_hid_service.py)"
      responsibility: "BlueZ D-Bus integration, SDP registration, L2CAP socket management, pairing"
      interfaces: ["start_service()", "stop_service()", "connect(addr)", "disconnect()", "get_status()"]
      dependencies:
        - component: "hid_descriptor"
          relationship: "uses HID report descriptor bytes"
      integration_points: ["BlueZ D-Bus", "L2CAP control+interrupt channels"]

    - component: "Input Reader (backend/input_reader.py)"
      responsibility: "Read evdev gamepad events, translate to HID reports"
      interfaces: ["start_reading(callback)", "stop_reading()", "get_devices()"]
      dependencies:
        - component: "hid_descriptor"
          relationship: "uses report format for packing"
      integration_points: ["Linux evdev subsystem", "L2CAP interrupt channel"]

    - component: "HID Descriptor (backend/hid_descriptor.py)"
      responsibility: "Define HID Report Descriptor bytes and report packing"
      interfaces: ["REPORT_DESCRIPTOR bytes", "pack_report(buttons, axes)"]
      dependencies: []
      integration_points: ["SDP record", "L2CAP data format"]

    - component: "Frontend Shell (src/)"
      responsibility: "UI for connection status, device management, settings"
      interfaces: ["React components", "useBackend hook for RPC"]
      dependencies:
        - component: "main.py"
          relationship: "calls Python methods via callable()"
      integration_points: ["@decky/api callable", "@decky/ui components"]

contracts:
  - from_task: task-backend-hid-descriptor
    to_task: task-backend-bt-hid
    interface: "REPORT_DESCRIPTOR: bytes, pack_report(buttons: int, axes: List[int]) -> bytes"
    format: "Python module import"

  - from_task: task-backend-hid-descriptor
    to_task: task-backend-input-reader
    interface: "pack_report(buttons: int, axes: List[int]) -> bytes"
    format: "Python module import"

  - from_task: task-backend-bt-hid
    to_task: task-plugin-entry
    interface: "BTHIDService class with start/stop/connect/disconnect/get_status async methods"
    format: "Python async class instantiation"

  - from_task: task-backend-input-reader
    to_task: task-plugin-entry
    interface: "InputReader class with start_reading/stop_reading/get_devices async methods"
    format: "Python async class instantiation"

  - from_task: task-plugin-entry
    to_task: task-frontend-hooks
    interface: "callable RPC: get_status, connect_device, disconnect_device, get_devices, get_config, set_config"
    format: "@decky/api callable<Args, Return> pattern"

  - from_task: task-frontend-hooks
    to_task: task-frontend-components
    interface: "useBackend() hook returning {status, devices, connect, disconnect, config, updateConfig}"
    format: "React custom hook"

  - from_task: task-scaffolding-config
    to_task: task-ci-build
    interface: "package.json scripts (build, watch), rollup.config.js, tsconfig.json"
    format: "npm/pnpm build output"

